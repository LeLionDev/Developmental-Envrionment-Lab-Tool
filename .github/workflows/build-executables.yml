name: Build executables

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: PoorManLabTool-windows
            artifact_path: dist/PoorManLabTool.exe
          - os: ubuntu-latest
            artifact_name: PoorManLabTool-linux
            artifact_path: dist/PoorManLabTool
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install PyInstaller
        run: pip install pyinstaller paramiko

      - name: Stamp version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: echo "__version__ = \"${GITHUB_REF_NAME}\"" > _version.py

      - name: Build executable
        run: pyinstaller PoorManLabTool.spec

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist-artifacts/PoorManLabTool-windows/PoorManLabTool.exe
            dist-artifacts/PoorManLabTool-linux/PoorManLabTool